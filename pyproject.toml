[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scene-tpr"
version = "0.1.0"
description = "A small reproducible study of letter-position tensor-product edits in a frozen scene network"
requires-python = ">=3.12"
dependencies = ["numpy>=2.0", "torch>=2.6", "matplotlib>=3.8"]

[tool.setuptools.packages.find]
where = ["src"]
